version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ethelpms-db
    environment:
      POSTGRES_DB: ethelpms
      POSTGRES_USER: ethelpms_admin
      POSTGRES_PASSWORD: DevP@ss2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethelpms_admin -d ethelpms"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ethelpms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ethelpms.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
