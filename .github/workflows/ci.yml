name: EthelPMS CI

on:
  push:
    branches: [main, develop, ethel-sol-branch]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore EthelPMS.slnx

      - name: Build
        run: dotnet build EthelPMS.slnx --no-restore --configuration Release

      - name: Run unit & architecture tests
        run: dotnet test EthelPMS.slnx --no-build --configuration Release --filter "Category!=Integration" --verbosity normal

  frontend:
    name: Frontend (Angular / Nx)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web & platform-console
        run: npx nx run-many -t lint -p web,platform-console,shared-core,shared-ui

      - name: Unit tests
        run: npx nx run-many -t test -p web,platform-console,shared-core,shared-ui --watch=false

      - name: Build web
        run: npx nx build web --configuration=production

      - name: Build platform-console
        run: npx nx build platform-console --configuration=production
